<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GRO10X OS Grand Auditor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      width: 420px;
      background: #070A14;
      color: #E3E2E6;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .logo {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
      color: #fff;
    }
    .logo span { color: #D4AF37; }
    .badge {
      background: rgba(212,175,55,0.15);
      color: #D4AF37;
      border: 1px solid rgba(212,175,55,0.3);
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
    }

    /* Tab Switcher */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      background: #121316;
      padding: 3px;
      border-radius: 8px;
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #849589;
      padding: 7px 4px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: #1B1B1F;
      color: #D4AF37;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    label {
      display: block;
      color: #849589;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
      margin-top: 8px;
    }
    select {
      width: 100%;
      background: #1B1B1F;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      margin-bottom: 10px;
      cursor: pointer;
    }
    select:focus { border-color: #D4AF37; }
    select optgroup {
      background: #121316;
      color: #D4AF37;
      font-weight: 700;
    }
    select option {
      background: #1B1B1F;
      color: #fff;
      padding: 4px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    button.action-btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #D4AF37, #8A6D1B);
      color: #070A14;
      box-shadow: 0 4px 14px rgba(212,175,55,0.25);
    }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-secondary {
      background: #1F1F23;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-secondary:hover { background: #292A2D; color: #D4AF37; }
    .btn-danger {
      background: rgba(239,68,68,0.2);
      color: #F87171;
      border: 1px solid rgba(239,68,68,0.4);
    }
    .btn-danger:hover { background: rgba(239,68,68,0.35); }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Pacing Settings Badge */
    .pacing-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #121316;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 10px;
    }
    .pacing-label {
      font-size: 11px;
      color: #94A3B8;
      font-weight: 600;
    }
    .pacing-select {
      width: auto;
      margin-bottom: 0;
      padding: 4px 8px;
      font-size: 11px;
      background: #1B1B1F;
      border: 1px solid rgba(212,175,55,0.3);
      color: #D4AF37;
      font-weight: 700;
      border-radius: 4px;
    }

    /* Progress Bar */
    .progress-container {
      margin-top: 10px;
      display: none;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #94A3B8;
      margin-bottom: 4px;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background: #1F1F23;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #D4AF37, #10B981);
      transition: width 0.2s ease;
    }

    /* Status & Log Box */
    .status {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-family: monospace;
      text-align: center;
      display: none;
    }
    .status.info {
      display: block;
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.3);
      color: #60A5FA;
    }
    .status.success {
      display: block;
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.3);
      color: #34D399;
    }
    .status.error {
      display: block;
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.3);
      color: #F87171;
    }

    .log-box {
      margin-top: 10px;
      height: 140px;
      background: #000;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 8px;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 10.5px;
      color: #94A3B8;
      overflow-y: auto;
      line-height: 1.4;
      display: none;
    }
    .log-entry { margin-bottom: 3px; word-break: break-all; }
    .log-info { color: #94A3B8; }
    .log-success { color: #34D399; font-weight: 600; }
    .log-warn { color: #FBBF24; }
    .log-error { color: #F87171; font-weight: 600; }

    /* Report Export & Actions Toolbar */
    .export-bar {
      margin-top: 10px;
      padding: 6px 8px;
      background: #0f121d;
      border: 1px solid rgba(212,175,55,0.25);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }
    .export-title {
      font-size: 10.5px;
      font-weight: 700;
      color: #D4AF37;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .export-actions {
      display: flex;
      gap: 5px;
    }
    .export-btn {
      background: #181C2A;
      color: #E3E2E6;
      border: 1px solid rgba(255,255,255,0.12);
      padding: 4px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      transition: all 0.15s ease;
    }
    .export-btn:hover {
      background: #252A3D;
      border-color: #D4AF37;
      color: #fff;
    }
    .export-btn.btn-subtle {
      opacity: 0.7;
    }
    .export-btn.btn-subtle:hover {
      opacity: 1;
      border-color: rgba(239,68,68,0.5);
      color: #F87171;
    }

    .footer-note {
      margin-top: 12px;
      font-size: 10px;
      color: #64748B;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">GRO10X <span>GRAND AUDITOR</span></div>
    <div style="display: flex; gap: 6px; align-items: center;">
      <button id="popoutBtn" title="Detach into standalone side window" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #E3E2E6; padding: 2px 7px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: 600;">↗ Pop Out</button>
      <span class="badge">v2.0 OS</span>
    </div>
  </div>

  <div class="tabs">
    <button id="tabSnapperBtn" class="tab-btn active">📸 Full-Page Snapper</button>
    <button id="tabRunnerBtn" class="tab-btn">🏆 Grand Audit (8 Platforms)</button>
  </div>

  <!-- VIEW 1: Full-Page Snapper -->
  <div id="viewSnapper">
    <label for="pageSelect">Select Portal / Page to Audit:</label>
    <select id="pageSelect">
      <optgroup label="── 1. Public &amp; Discovery ──">
        <option value="/">1. Homepage (/)</option>
        <option value="/showcase">2. Deal Showcase (/showcase)</option>
        <option value="/projects/segreto-dhk-01">3. Project Room (/projects/segreto-dhk-01)</option>
        <option value="/secondary-market">4. Secondary Market (/secondary-market)</option>
        <option value="/financial-model">5. Financial DCF Model (/financial-model)</option>
        <option value="/cash-concierge">6. Cash Concierge OTC (/cash-concierge)</option>
      </optgroup>

      <optgroup label="── 2. Investor Portal ──">
        <option value="/investor">7. Investor Portfolio (/investor)</option>
        <option value="/investor-onboard">8. Investor Onboarding (/investor-onboard)</option>
        <option value="/payouts">9. Dividend Payouts (/payouts)</option>
        <option value="/funding-rounds">10. Funding Rounds (/funding-rounds)</option>
        <option value="/legal-contracts">11. Legal Contracts Vault (/legal-contracts)</option>
      </optgroup>

      <optgroup label="── 3. Founder &amp; Business ──">
        <option value="/business">12. Founder Dashboard (/business)</option>
        <option value="/apply">13. Cohort Application (/apply)</option>
        <option value="/apply/status">14. Application Status (/apply/status)</option>
        <option value="/pos-sync">15. POS Sales Ingestion (/pos-sync)</option>
        <option value="/buildout-tracker">16. Buildout Milestones (/buildout-tracker)</option>
      </optgroup>

      <optgroup label="── 4. Admin &amp; Operations ──">
        <option value="/admin">17. Super-Admin Command (/admin)</option>
        <option value="/kam-dashboard">18. KAM Workspace (/kam-dashboard)</option>
        <option value="/promoter">19. Promoter Affiliate Hub (/promoter)</option>
        <option value="/team-miniapp">20. Field Team MiniApp (/team-miniapp)</option>
        <option value="/fraud-detection">21. Audit &amp; Fraud Desk (/fraud-detection)</option>
        <option value="/ai-assistant">22. AI Copilot (/ai-assistant)</option>
        <option value="/telegram">23. Telegram Bot Hub (/telegram)</option>
        <option value="/track/maats-cottage">24. Maats Cottage Tracker (/track/maats-cottage)</option>
      </optgroup>

      <optgroup label="── 5. Legal &amp; Policy ──">
        <option value="/terms">25. Terms of Service (/terms)</option>
        <option value="/privacy">26. Privacy Policy (/privacy)</option>
        <option value="/risk-disclosure">27. Risk Disclosure (/risk-disclosure)</option>
      </optgroup>
    </select>

    <div class="btn-group">
      <button id="navigateBtn" class="action-btn btn-secondary">
        <span>↗ Navigate to Page</span>
      </button>
      <button id="captureBtn" class="action-btn btn-primary">
        <span>📸 Auto-Scroll &amp; Capture Full Page</span>
      </button>
    </div>
  </div>

  <!-- VIEW 2: Grand Audit Runner -->
  <div id="viewRunner" style="display: none;">
    <div class="pacing-bar">
      <span class="pacing-label">Execution Pacing:</span>
      <select id="pacingSelect" class="pacing-select">
        <option value="human" selected>800ms Human Pacing (Visual)</option>
        <option value="fast">Fast Mode (CI / 50ms)</option>
      </select>
    </div>

    <label for="platformSelect">Target Audit Scope:</label>
    <select id="platformSelect">
      <option value="all">🌟 All 8 Platforms (Grand Audit — 127 suites)</option>
      <option value="platform-1">1. Public &amp; Discovery Desk (17 deep suites)</option>
      <option value="platform-2">2. Investor Portal &amp; Liquidity (17 deep suites)</option>
      <option value="platform-3">3. SME Founder Command (17 deep suites)</option>
      <option value="platform-4">4. Master Admin Center (20 deep suites &amp; modals)</option>
      <option value="platform-5">5. KAM Field Operations Desk (16 deep suites)</option>
      <option value="platform-6">6. Promoter CRM &amp; Commissions (12 deep suites)</option>
      <option value="platform-7">7. Telegram MiniApp &amp; AI Copilot (14 deep suites)</option>
      <option value="platform-8">8. Work-Order Financing Desk (14 deep suites)</option>
    </select>

    <div class="btn-row">
      <button id="startAuditBtn" class="action-btn btn-primary">
        <span>🚀 Start Audit Run</span>
      </button>
      <button id="abortAuditBtn" class="action-btn btn-danger" style="display: none;">
        <span>⏹ Abort</span>
      </button>
    </div>

    <div id="progressContainer" class="progress-container">
      <div class="progress-header">
        <span id="progressSuiteTitle">Auditing...</span>
        <span id="progressCount">0%</span>
      </div>
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <div id="exportBar" class="export-bar" style="display: none;">
      <div class="export-title">Audit Report</div>
      <div class="export-actions">
        <button id="copyReportBtn" class="export-btn" title="Copy markdown report to clipboard">
          <span>📋 Copy</span>
        </button>
        <button id="exportMdBtn" class="export-btn" title="Download Markdown report (.md)">
          <span>📥 .MD</span>
        </button>
        <button id="exportJsonBtn" class="export-btn" title="Download JSON report (.json)">
          <span>📥 .JSON</span>
        </button>
        <button id="clearLogsBtn" class="export-btn btn-subtle" title="Clear logs & reset">
          <span>🧹 Clear</span>
        </button>
      </div>
    </div>

    <div id="logBox" class="log-box"></div>
  </div>

  <div id="statusBox" class="status"></div>

  <div class="footer-note" id="footerNote">
    Calibrated for 10s async route hydration, 4.5s actions, and 800ms human pacing delay.
  </div>

  <script src="suites/registry.js"></script>
  <script src="suites/selector-engine.js"></script>
  <script src="suites/runner.js"></script>
  <script src="popup.js"></script>
</body>
</html>
